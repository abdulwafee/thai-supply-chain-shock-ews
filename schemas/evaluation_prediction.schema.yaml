# Schema for data/model_input/b4_walk_forward_predictions.parquet — Task B4.
# Describes what the code ACTUALLY writes
# (thai_supply_chain_ews.evaluation.walk_forward.PREDICTION_COLUMNS),
# verified by tests/test_b4_walk_forward.py.
#
# These are OUT-OF-FOLD DEVELOPMENT predictions only. The locked final test
# period is not present and was not evaluated.

schema_version: 1
table: model_input/b4_walk_forward_predictions
grain: [forecast_origin_month, industry_id, horizon_months, baseline_name]
primary_key: [forecast_origin_month, industry_id, horizon_months, baseline_name]
written_by: thai_supply_chain_ews.evaluation.walk_forward.run_walk_forward
scope: development_only
locked_test_included: false
data_framing: latest_vintage_historical_data

columns:
  - name: forecast_origin_month
    type: string
    nullable: false
    note: "Information-availability month t. Development range 2024-01 .. 2025-03."
  - name: industry_id
    type: string
    nullable: false
  - name: horizon_months
    type: int64
    nullable: false
    allowed_values: [1, 3]
  - name: baseline_name
    type: string
    nullable: false
    allowed_values: [persistence_current_month, persistence_trailing_3m_max,
                     industry_historical_mean, seasonal_naive, no_contraction]
  - name: predicted_raw_value
    type: float64
    nullable: true
    note: "Null for industry_historical_mean, which predicts directly on the score scale."
  - name: predicted_score
    type: float64
    nullable: false
    unit: score_0_100
  - name: observed_raw_target
    type: float64
    nullable: false
    unit: percent_adverse_direction_positive
  - name: observed_score
    type: float64
    nullable: false
    unit: score_0_100
    note: "Transformed with the calibrator frozen at this origin, after prediction."
  - name: observed_risk_level
    type: string
    nullable: false
    allowed_values: [Normal, Watch, High, Severe]
  - name: calibration_reference_start
    type: string
    nullable: false
  - name: calibration_reference_end
    type: string
    nullable: false
    rule: "must be <= forecast_origin_month (origin month itself is permitted)"
  - name: calibration_observation_count
    type: int64
    nullable: false
    rule: ">= 24"
  - name: calibration_fingerprint
    type: string
    nullable: false
    note: "SHA-256 of the frozen per-industry reference set; differs at every origin."
  - name: max_training_target_window_end
    type: string
    nullable: true
    rule: "must be <= forecast_origin_month; enforced on WINDOW END, not origin date"
  - name: training_label_count
    type: int64
    nullable: false
  - name: split_name
    type: string
    nullable: false
    allowed_values: [DEV-1, DEV-2, DEV-3]
    note: "Reporting block only — state is rebuilt at every origin regardless of block."
  - name: target_definition_version
    type: string
    nullable: false
  - name: evaluation_harness_version
    type: string
    nullable: false

snapshot_expectations:
  development_origins: 15
  first_origin: 2024-01-01
  last_origin: 2025-03-01
  rows_per_horizon_per_baseline: 180
  predictions_per_origin_per_horizon_per_baseline: 12
  total_rows: 1620 # (4 baselines h=1 + 5 baselines h=3) x 180
