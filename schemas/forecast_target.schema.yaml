# Schema for data/targets/forecast_target_raw.parquet — Task B3.
# RAW horizon labels only. Calibrated scores are fold-specific and are NOT
# persisted here; see docs/b3_target_definition.md for the workflow.

schema_version: 1
table: targets/forecast_target_raw
grain: [forecast_origin_month, industry_id, horizon_months]
primary_key: [forecast_origin_month, industry_id, horizon_months]
written_by: thai_supply_chain_ews.targets.labels.build_forecast_labels
target_name: industry_production_stress_score
format: long

columns:
  - name: forecast_origin_month
    type: string
    nullable: false
    note: "Information-availability month t. Must itself have a valid observed mpi_adverse_yoy."
  - name: industry_id
    type: string
    nullable: false
  - name: horizon_months
    type: int64
    nullable: false
    allowed_values: [1, 3]
  - name: target_window_start
    type: string
    nullable: false
    note: "t+1"
  - name: target_window_end
    type: string
    nullable: false
    note: "t+1 for h=1; t+3 for h=3"
  - name: target_peak_month
    type: string
    nullable: false
    rule: "month attaining the maximum; ties resolved to the EARLIEST month"
  - name: target_peak_lead_month
    type: int64
    nullable: false
    note: "offset in months from the origin (1, 2, or 3)"
  - name: target_raw_value
    type: float64
    nullable: false
    unit: percent_adverse_direction_positive
  - name: target_raw_unit
    type: string
    nullable: false
  - name: target_definition_version
    type: string
    nullable: false

horizon_semantics:
  1: "target_raw_1m(i,t) = mpi_adverse_yoy(i, t+1)"
  3: "target_raw_3m(i,t) = max(mpi_adverse_yoy(i, t+1..t+3)) — worst stress in the next 3 months"

window_policy:
  incomplete_window: dropped_never_truncated
  preliminary_month_in_window: dropped
  excluded_target_months: [2026-06-01]

snapshot_expectations:
  combined_rows: 1224
  horizon_1:
    rows: 624
    origins_per_industry: 52
    first_origin: 2022-01-01
    last_origin: 2026-04-01
  horizon_3:
    rows: 600
    origins_per_industry: 50
    first_origin: 2022-01-01
    last_origin: 2026-02-01
