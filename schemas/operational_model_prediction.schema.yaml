# Schema for the D4 frozen-specification operational model predictions.
#
# Describes what the code ACTUALLY writes
# (thai_supply_chain_ews.modeling.operational_model_artifacts.
#  OPERATIONAL_MODEL_PREDICTION_COLUMNS), verified by
# tests/test_d4_operational_model.py.
#
# Does not replace schemas/development_model_prediction.schema.yaml (D1) or
# schemas/operational_prediction.schema.yaml (D3).

schema_version: 1
task: D4
model_version: operational_fixed_ridge_residual_v1
written_by: scripts/run_d4_operational_model.py
output: data/model_input/d4_operational_model_predictions.parquet   # git-ignored

evidence_framing:
  # Recorded first because it governs how every number may be read.
  specification_frozen_after_d1_results: true
  confirmatory_evaluation: false
  exploratory_development_evaluation: true
  nested_model_selection_performed: false
  locked_test_eligible: false
  approved_for_locked_test: false
  production_model_approved: false

frozen_specification:
  alpha: 100.0
  fit_intercept: true
  nonferrous_channel: none
  allowed_commodities: [brent_crude_usd_bbl, rubber_rss3_usd_kg]
  excluded_commodities: [aluminum_usd_mt, copper_usd_mt]
  excluded_reason: >-
    Aluminum and Copper read the SAME I/O sector 107 coefficient. Admitting
    either would allow one shared exposure to be used twice, a channel to be
    chosen on outcomes, and two series to be reported as independent
    measurements. Both are excluded so the choice does not exist.
  excluded_predictors_zero_filled: false
  hyperparameter_search: false
  inner_cross_validation: false
  model_averaging: false

operational_model_prediction:
  grain: [forecast_origin_month, industry_id, horizon_months, feature_variant]
  expected_rows:
    primary_per_horizon: 180
    structural_per_horizon: 180
    timing_per_horizon_if_fully_available: 180
    total_maximum: 1080
  ordering: [feature_variant, horizon_months, industry_id, forecast_origin_month]

  columns:
    - name: forecast_origin_month
      type: date
      nullable: false
      note: "Forecast ISSUE month t, from the D3 operational contract."
    - name: forecast_issue_date
      type: date
      nullable: false
      note: "Verified OIE release, during t, of reference month t-1."
    - name: latest_available_stress_month
      type: date
      nullable: false
      note: "Always t-1; asserted strictly less than forecast_origin_month."
    - name: industry_id
      type: string
      nullable: false
    - name: horizon_months
      type: integer
      enum: [1, 3]
    - name: model_name
      type: string
      const: operational_fixed_ridge_residual
    - name: feature_variant
      type: string
      enum:
        - primary_direct_lag2
        - timing_sensitivity_direct_lag1
        - structural_sensitivity_total_lag2
      note: "The combination lag1 + total_requirement is forbidden and never built."

    - name: d3_benchmark_name
      type: string
      enum: [operational_persistence_latest_published, operational_persistence_trailing_3m_max]
      note: "h=1 uses latest_published; h=3 uses trailing_3m_max."
    - name: d3_benchmark_prediction
      type: float
      nullable: false
    - name: predicted_residual
      type: float
      nullable: false
      note: "0.0 exactly when model_quality is degenerate."
    - name: model_quality
      type: string
      enum: [ok, degenerate_all_predictors_constant_benchmark_only]
      note: >-
        Degenerate means every eligible conditioned predictor is a structural
        constant (zero exposure coefficient), so the X-only zero-variance rule
        removed all of them. The prediction then equals the benchmark exactly.
        This follows D1's registered precedent and is NOT a tuning choice.
    - name: unclipped_prediction
      type: float
      nullable: false
    - name: predicted_score
      type: float
      nullable: false
      minimum: 0.0
      maximum: 100.0
    - name: clipped
      type: boolean
      nullable: false

    - name: observed_raw_target
      type: float
      nullable: false
      note: "B3 raw target, reused unchanged."
    - name: observed_score
      type: float
      nullable: false
      note: "Calibrated with the origin-t calibrator, whose cutoff is t-1."
    - name: observed_risk_level
      type: string
      enum: [Normal, Watch, High, Severe]

    - name: calibration_reference_end
      type: date
      note: "Always t-1."
    - name: calibration_fingerprint
      type: string
    - name: max_training_target_window_end
      type: date
      nullable: true
    - name: max_training_target_available_month
      type: date
      nullable: true
      note: "Asserted <= forecast_origin_month."
    - name: label_permitted_rows
      type: integer
      note: "Per industry; x12 gives the panel total."
    - name: feature_usable_rows
      type: integer

    - name: predictor_names
      type: string
      note: "Semicolon-joined retained predictors; empty when degenerate."
    - name: predictor_count
      type: integer
      minimum: 0
      maximum: 10
    - name: omitted_ineligible_predictors
      type: string
      note: "Omitted, never zero-filled. IND-06 carries the 5 Rubber predictors here."
    - name: omitted_zero_variance_predictors
      type: string
      note: "Detected from X only; using y would be outcome-based filtering."

    - name: fixed_alpha
      type: float
      const: 100.0
    - name: fixed_nonferrous_channel
      type: string
      const: none
    - name: aluminum_predictors_present
      type: boolean
      const: false
    - name: copper_predictors_present
      type: boolean
      const: false
    - name: shared_io_sector_107_used
      type: boolean
      const: false

    - name: scaler_checksum
      type: string
      nullable: true
    - name: model_checksum
      type: string
      nullable: true
    - name: feature_snapshot_checksum
      type: string
    - name: c2_lineage_checksums
      type: string
    - name: c3_exposure_checksums
      type: string
    - name: operational_contract_version
      type: string
      const: operational_contract_v1
    - name: model_version
      type: string
    - name: split_name
      type: string
      enum: [DEV-1, DEV-2, DEV-3]
    - name: exploratory_development_evaluation
      type: boolean
      const: true
    - name: confirmatory_result
      type: boolean
      const: false
    - name: locked_test_accessed
      type: boolean
      const: false

invariants:
  - "fixed_alpha == 100.0 on every row; D4 performs no hyperparameter search."
  - "fixed_nonferrous_channel == 'none' on every row."
  - "No predictor name begins with aluminum_usd_mt__ or copper_usd_mt__, in
     predictor_names, omitted_zero_variance_predictors or the scaler."
  - "IND-06 never carries a rubber predictor; its five Rubber transformations
     appear in omitted_ineligible_predictors instead."
  - "latest_available_stress_month < forecast_origin_month."
  - "calibration_reference_end == latest_available_stress_month == t-1."
  - "max_training_target_available_month <= forecast_origin_month."
  - "predicted_score == clip(unclipped_prediction, 0, 100), and
     unclipped_prediction == d3_benchmark_prediction + predicted_residual."
  - "predicted_residual == 0.0 wherever model_quality is degenerate."
  - "Keys unique on the declared grain; primary and structural carry exactly
     180 rows per horizon."
  - "No purge origin and no locked-test origin appears."
