    C12: {artifact: docs/c12_channel_closure.json, role: channel closure}

# ---------------------------------------------------------------------------
# 4. Supersession. A superseded result stays in the ledger; it is marked, not
#    removed, because deleting a negative result is how a record starts lying.
# ---------------------------------------------------------------------------
supersession:
  rules:
    superseded_results_remain_in_the_ledger: true
    superseded_results_presented_as_current: false
    supersession_marker_required: superseded_by
    graph_must_be_acyclic: true
  edges:
    - {superseded: D1, superseded_by: D3, scope: operational_interpretation,
       reason: "D1's evaluation was not operationally release-timing correct"}
    - {superseded: D1, superseded_by: D4, scope: operational_interpretation,
       reason: "D4 re-evaluated the commodity model under the D3 contract"}
    - {superseded: D3, superseded_by: D3R1, scope: benchmark_selection_wording,
       reason: "D3-R1 corrected the benchmark-selection and verification claims"}
    - {superseded: C11, superseded_by: C11R1, scope: methodological_status,
       reason: "C11-R1 corrected the status without changing the findings"}

# ---------------------------------------------------------------------------
