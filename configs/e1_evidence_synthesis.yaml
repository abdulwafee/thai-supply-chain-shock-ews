# Task E1 — project-wide development evidence synthesis and baseline-reference
# closeout.
#
# FROZEN BEFORE ANY NUMERICAL RESULT ARTIFACT IS READ. The included tasks, the
# evidence-status vocabulary, the required tables, the claim-registry schema,
# the supersession rules, the prohibited claims, the portfolio wording
# constraints, the locked-test guards and the expected project-status fields are
# all hashed first. A synthesis rule changed after inspecting a task metric
# raises.
#
# E1 SYNTHESISES; IT DOES NOT EVALUATE. It reruns no model, recomputes no metric
# from raw predictions, fits nothing, compares no new estimator, selects no
# commodity or channel, mines no subgroup, changes no published decision status,
# reads no purge outcome, and never opens, hashes, summarises or infers a locked
# outcome.
#
# THE FINAL CONCLUSION: a leakage-aware, release-aware research pipeline was
# built successfully; D3 supplies the registered operational reference
# benchmarks; no commodity model candidate earned locked-test access; no
# production model was selected or deployed; the locked final test remains
# sealed.

schema_version: 1
task: E1
config_version: e1_evidence_synthesis_v1
synthesis_contract_version: e1_synthesis_contract_v1

# ---------------------------------------------------------------------------
# 1. Evidence-status vocabulary. Exactly one per material claim, and the
#    collapses that would flatter the record are named and forbidden.
# ---------------------------------------------------------------------------
evidence_status_vocabulary:
  - verified
  - supported_with_limitations
  - inconclusive
  - not_supported
  - unresolved
  - not_attempted
  - superseded
prohibited_collapses:
  inconclusive_into_no_effect: >-
    An interval that crosses zero is a failure to demonstrate, not a
    demonstration of failure.
  not_supported_into_disproven: >-
    A model that did not beat its benchmark has not disproved the hypothesis it
    encoded.
  unresolved_into_absent: >-
    A quantity nobody measured is unresolved. Recording it as zero asserts a
    measurement that was never made.
  selected_reference_into_proven_superiority: >-
    D3's persistence benchmarks are the REGISTERED reference. The paired
    comparison against no-contraction was inconclusive at both horizons.
  development_evaluation_into_production_validation: >-
    A development walk-forward is not a production validation, and no model was
    deployed.
  latest_vintage_into_real_time_backtesting: >-
    Latest-vintage targets cannot reproduce what was knowable at the time. The
    project is release-aware, not point-in-time on the target side.

# ---------------------------------------------------------------------------
# 2. Required project status. The engineering programme completed; the
#    candidate models did not earn promotion. Those are different sentences.
# ---------------------------------------------------------------------------
project_status:
  development_program_status: closed_without_supported_incremental_commodity_model
  registered_operational_reference_available: true
  registered_operational_reference_source: D3
  operational_model_selected: false
  production_deployment_authorized: false
  commodity_incremental_signal_supported: false
  model_feature_approved: false
  confirmatory_claim_authorized: false
  locked_test_status: sealed_unopened
  locked_test_outcomes_read: false
  fully_real_time_backtest: false
  latest_vintage_target_evaluation: true
  future_reopening_requires_new_external_evidence: true
project_failed_language_permitted: false

# ---------------------------------------------------------------------------
# 3. Included tasks and their artifacts.
# ---------------------------------------------------------------------------
included_tasks:
