    D2: {artifact: docs/d2_target_timing_decision.json, role: release timing}
    D3: {artifact: docs/d3_operational_baseline_results.json,
         role: operational contract and reference baselines}
    D3R1: {artifact: docs/d3r1_benchmark_interpretation.json,
           role: benchmark-selection correction}
    D3_LOCKED: {artifact: docs/d3_locked_test_manifest.json,
                role: key-only locked-test reservation}
  world_bank_path:
    C1: {artifact: docs/c1_commodity_source_audit.json, role: source timing}
    C2: {artifact: docs/c2_commodity_feature_audit.json, role: transformations}
    C3: {artifact: docs/c3_commodity_exposure_matrix.json, role: I/O exposure}
    C4: {artifact: docs/c4_industry_conditioned_feature_audit.json,
         role: conditioned matrix}
    D1: {artifact: docs/d1_development_results.json,
         role: original development evaluation}
    D4: {artifact: docs/d4_operational_model_results.json,
         role: operational fixed-specification evaluation}
  eppo_path:
    C5: {artifact: docs/c5_price_stage_source_audit.json, role: stage alignment}
    C7: {artifact: docs/c7_eppo_full_archive_audit.json, role: full ingestion}
    C7_5: {artifact: docs/c7_5_eppo_semantic_decision.json,
           role: semantic closure}
    C8: {artifact: docs/c8_eppo_transformation_audit.json,
         role: source transformations}
    C9: {artifact: docs/c9_fuel_oil_conditioning_audit.json,
         role: structural conditioning}
    C9_EXPOSURE: {artifact: docs/c9_sector093_exposure_decision.json,
                  role: sector-093 structural decision}
    C10: {artifact: docs/c10_design_matrix_audit.json,
          role: identifiability audit}
    C11: {artifact: docs/c11_architecture_decision.json,
          role: architecture decision}
    C11R1: {artifact: docs/c11r1_governance_decision.json,
            role: governance correction}
    D5: {artifact: docs/d5_development_results.json,
