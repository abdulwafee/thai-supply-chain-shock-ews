# ---------------------------------------------------------------------------
# 6. Source and timing evidence. Evidence quality is NOT equal across sources
#    merely because the formulas match.
# ---------------------------------------------------------------------------
source_timing_table:
  - source_family: OIE MPI target
    values: latest vintage
    historical_timing: "month t+1 timing supported for the audited period"
    point_in_time_status: target vintages unavailable
    main_limitation: not a real-time target panel
  - source_family: World Bank Pink Sheet
    values: archived first release
    historical_timing: verified monthly publication timing
    point_in_time_status: feature side supported
    main_limitation: target side remains latest vintage
  - source_family: NESDC I/O
    values: official 2015 Final structure
    historical_timing: structurally available by 2020-03-31
    point_in_time_status: time-invariant structural input
    main_limitation: old benchmark and broad sectors
  - source_family: EPPO refinery prices
    values: historical latest-vintage documents
    historical_timing: historical first-release timing unverified
    point_in_time_status: not point-in-time
    main_limitation: policy lag 2 and broad proxy
equivalent_evidence_quality_implied_across_sources: false

# ---------------------------------------------------------------------------
# 7. Structural evidence. Attribution, never causal transmission.
# ---------------------------------------------------------------------------
structural_synthesis:
  nesdc_2015_final_uses_purchasers_prices: true
  nesdc_2015_final_is_import_inclusive: true
  structural_coefficients_treated_as_time_invariant: true
  world_bank_commodity_mappings_are_broad_proxies: true
  aluminum_and_copper_share_sector_107: true
  aluminum_and_copper_are_independent_exposure_measurements: false
  sector_031_crude_exposure_often_direct_zero: true
  sector_093_refinery_product_exposure_positive_for_all_12_industries: true
  eppo_ex_refinery_versus_purchasers_price_partial_mismatch: true
  fo600_and_fo1500_are_distinct_channels_sharing_one_exposure: true
  ind_04_producer_consumer_direction_ambiguous: true
  c10_conditioning_adds_scale_not_temporal_degrees_of_freedom: true
  c11_pooled_interaction_identifiable: true
  c11_selection_status: exploratory_supported_after_documented_specification_correction
  structural_attribution_described_as_causal_transmission: false

# ---------------------------------------------------------------------------
# 8. Cross-task conclusions, in order.
# ---------------------------------------------------------------------------
cross_task_conclusions:
  - id: X1
    text: >-
      D1 did not support the original commodity residual model and carried a
      protocol limitation: the nested selection was not fully executed and six
      of thirty origin-horizon cases used the conservative fallback.
    status: not_supported
  - id: X2
    text: >-
      D3 corrected the issue-month timing contract and established the
      registered operational reference baselines.
    status: verified
  - id: X3
    text: >-
      D4 did not demonstrate incremental World Bank commodity signal under the
      fixed operational specification.
    status: not_supported
  - id: X4
    text: >-
      D5 did not demonstrate incremental EPPO fuel-oil signal under the only
      structurally supported pooled interaction architecture.
    status: inconclusive
  - id: X5
    text: >-
      No candidate satisfied the conditions required to open the locked test.
    status: verified
  - id: X6
    text: >-
      The appropriate final system reference is therefore baseline-only.
    status: verified
  - id: X7
    text: >-
      Baseline-only means a registered evaluation reference - not a production
      deployment, and not proof of superiority over every trivial forecast.
    status: verified

# ---------------------------------------------------------------------------
# 9. Locked-test closeout. Verified WITHOUT opening outcome contents.
# ---------------------------------------------------------------------------
locked_test:
  manifest: docs/d3_locked_test_manifest.json
  manifest_is_key_only: true
  horizon_1_range: ["2025-07", "2026-04"]
  horizon_3_range: ["2025-07", "2026-02"]
  reserved_months: 10
  purge_months: ["2025-04", "2025-06"]
  outcomes_read_by_any_task: false
  prediction_or_metric_exists_for_locked_origins: false
  any_candidate_locked_test_evaluation_authorized: false
  c12_reopening_rules_active: true
  required_language: >-
    The locked final test was intentionally left unopened because no
    independently preregistered candidate earned access through development
    evidence.
  prohibited_language:
    - locked test passed
    - locked test validated
    - unused data proving generalization
    - held-out validation confirms
    - out-of-sample performance confirmed

# ---------------------------------------------------------------------------
# 10. Claim registry.
# ---------------------------------------------------------------------------
claim_registry:
  required_fields:
    - claim_id
    - claim_text
    - status
    - scope
    - audience
    - evidence_artifact
    - evidence_json_pointer
    - limitations
    - locked_test_dependency
  conditional_fields:
    superseded_by: required_when_status_is_superseded
  locked_test_dependency_required_value: false
  audiences: [technical, portfolio, both]
  scopes: [foundation, world_bank_path, eppo_path, cross_task, project_status,
           locked_test, structural, source_timing]
  failure_conditions:
    - numerical_claim_cannot_be_reconciled_with_its_source_artifact
    - superseded_result_presented_as_current
    - claim_depends_on_locked_outcomes
    - limitation_required_by_its_source_artifact_omitted
    - two_incompatible_evaluation_contracts_compared_without_qualification
  incompatible_contract_pairs:
    - [D1, D3]
    - [D1, D4]
    - [D1, D5]
  qualification_required_phrase: different evaluation contract

# ---------------------------------------------------------------------------
# 11. Portfolio wording constraints.
# ---------------------------------------------------------------------------
portfolio:
  audience: computer_science_ml_internship
  internal_task_codes_in_main_narrative: false
  task_codes_permitted_in: [technical_appendix, evidence_links]
  must_explain:
    - business_problem_motivation
    - why_random_splitting_would_leak
    - publication_timing_and_vintage_handling
    - how_official_io_data_connected_prices_to_industries
    - why_reasonable_features_became_degenerate
    - how_operational_baselines_were_rebuilt
    - what_the_development_experiments_found
    - why_not_opening_the_locked_test_is_a_positive_result
    - technical_skills_demonstrated
    - what_would_be_required_to_reopen
  prohibited_claims:
    - beat the baseline
    - beats the baseline
    - outperformed the benchmark
    - deployable early-warning model
    - production ready
    - fully real-time
    - real-time backtest
    - commodities have no predictive value
    - proved commodities do not predict
    - validated on unseen final-test outcomes
    - locked test confirms
  cv_bullets: 3
  cv_bullets_may_imply_positive_predictive_performance: false

# ---------------------------------------------------------------------------
# 12. Prohibited actions and required outputs.
# ---------------------------------------------------------------------------
prohibited_actions:
  - rerun_d1_d3_d4_or_d5_models
  - recompute_development_metrics_from_raw_predictions
  - fit_a_new_model
  - compare_another_estimator
  - select_a_commodity_or_channel
  - subgroup_mining
  - change_a_published_decision_status
  - access_purge_outcomes
  - open_hash_summarise_or_infer_locked_outcomes
  - delete_negative_result_artifacts
  - rewrite_prior_decision_log_entries
  - describe_an_inconclusive_result_as_no_effect
  - describe_d3_as_a_production_model
metrics_verified_against_registered_artifacts: true
alternative_metrics_generated: false

reproducibility_manifest:
  test_count_source: measured_from_an_actual_pytest_run
  test_count_copied: false
  ruff_result_source: measured_from_an_actual_ruff_run
  raw_file_manifests_referenced_not_duplicated: true
  referenced_raw_manifests:
    - data/raw/_manifests/EPPO_PRICE_STRUCTURE_manifest.jsonl
    - data/raw/_manifests/OIE_MPI_manifest.jsonl
  environment:
    python: "3.14"
    dependency_file: pyproject.toml
    virtualenv: .venv
  commands:
    tests: python -m pytest -q
    lint: python -m ruff check .
    synthesis: python scripts/run_e1_evidence_synthesis.py

outputs:
  technical_closeout: docs/e1_technical_closeout.md
  portfolio_case_study: docs/e1_portfolio_case_study.md
  executive_summary: docs/e1_executive_summary.md
  evidence_ledger: docs/e1_evidence_ledger.json
  reproducibility_manifest: docs/e1_reproducibility_manifest.json
  model_artifact_created: false
  prediction_artifact_created: false
  metric_artifact_created: false

final_declaration:
  - development_program_is_complete
  - data_timing_lineage_and_evaluation_infrastructure_is_reproducible
  - d3_persistence_forecasts_remain_the_registered_operational_reference
  - no_commodity_model_demonstrated_sufficient_incremental_development_evidence
  - no_model_or_feature_was_approved_for_operational_deployment
  - locked_final_test_remains_sealed
  - future_reopening_requires_new_external_evidence_and_a_new_independent_preregistration
