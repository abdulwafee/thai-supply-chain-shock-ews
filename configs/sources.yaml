# --- temporal fields that could NOT be verified ------------------------------
# Deliberately null. The OIE workbooks carry no per-month publication date, and
# no archived release calendar was located. Fabricating a release_date or
# available_as_of per historical month would manufacture point-in-time
# information this project does not have.
temporal_verification:
  release_date:
    verified: false
    value: null
    note: >-
      Not present in the source workbooks and no archived OIE release calendar
      was found. Emitted as null for every month. A single press release
      observed during A1 suggested a ~30-day lag, which is recorded in
      configs/data.yaml release_lag as an observation, not applied here as a
      per-month fact.
  available_as_of:
    verified: false
    value: null
    note: >-
      Cannot be derived without release_date. Emitted as null. Any future
      point-in-time work must obtain real vintage/release metadata first —
      see docs/task_a1_report.md §6.

