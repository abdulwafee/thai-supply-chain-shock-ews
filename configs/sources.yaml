# Pinned source configuration — Task B1 production ingestion
#
# Files are resolved through their retrieval manifests
# (data/raw/_manifests/<source_id>_manifest.jsonl), never through a hard-coded
# absolute path or a hard-coded retrieval date. The manifest supplies the path;
# this file supplies the expectations that path must satisfy.
#
# If a resolved file's SHA-256 or edition does not match what is pinned here,
# ingestion FAILS LOUDLY (SourceIntegrityError). It does not warn and continue.
# Refreshing the data is therefore a deliberate act: re-download, then update
# the checksum here in the same commit.

schema_version: 1

# MVP data policy — see docs/architecture/decision_log.md AD-R5..AD-R13
mvp_policy:
  edition_scope: current_edition_only
  edition: "2021_based"
  base_year: 2021
  bridge_older_editions: false
  preliminary_rows: retained_but_model_ineligible
  evaluation_framing: latest_vintage_historical_data
  historical_bridging: deferred_to_phase_2
  bridge_evidence_status: >-
    Task A1/A2 bridge validation (oie_overlap_bridge_v1 and v2) is preserved as
    research documentation only. It does not feed the MVP core panel.

# Target publication timing — measured in Task D2 (docs/d2_target_timing_decision.md).
# Recorded here as a property of the source. Nothing in this block changes the
# pinned checksums above, the B4 split, or any model; D2 was an audit.
target_publication_timing:
  measured_by: D2
  source_of_truth: docs/d2_target_timing_decision.json
  evidence_outcome: timing_only_supported
  credible_months: 111
  credible_coverage: "2017-04..2026-07"
  publication_lag_days: {min: 23, median: 29, max: 66}
  publishes_in_month_after_reference: true
  availability_lag_months: 1
  same_month_availability_supported: false
  b4_current_month_assumption: violated
  b4_split_changed: false
  live_workbook_overwritten_in_place: true
  point_in_time_vintages_available: false
  # The newest month carries a trailing glyph in the workbook header, and the
  # glyph moves forward on each release. The workbook defines no legend for it,
  # so its meaning is NOT asserted to be "preliminary".
  newest_month_marker_observed: true
  marker_semantics_documented: false
  historical_extension_feasible: false
  base_year_splice_admissible: false

  # Task D3 consumes the timing above to build an operational forecast-origin
  # contract. See configs/operational_evaluation.yaml and
  # docs/d3_operational_evaluation_protocol.md. Nothing in D3 changes this
  # block, the pinned checksums above, or any B3 target.
  consumed_by:
    task: D3
    contract: operational_contract_v1
    framing: release_lag_aware_latest_vintage_evaluation
    b4_assumption_resolution: >-
      D3 replaces the violated current-month assumption with issue-at-t /
      observe-t-1. B4 and D1 are preserved unchanged and relabelled
      non_operational_calendar_boundary_experiment.
    downstream_model: >-
      Task D4 evaluates one frozen commodity residual model under this contract
      (configs/d4_operational_model.yaml). Exploratory only; it changes no
      source, no target and no feature eligibility.

# Task C5 recommended ONE additional source family for a later C6 ingestion
# audit. Nothing is ingested here and no feature is approved.
# See configs/price_stage_source_candidates.yaml.
price_stage_gap:
  audited_by: C5
  finding: >-
    Brent direct exposure is zero for 10 of 12 industries; indirect exposure of
    7-17% is mediated by Electricity (135), Petroleum refineries (093) and
    Petrochemical products (086). Industries buy refined fuel and power, not
    crude, so the current Brent series is stage-misaligned wherever direct
    exposure is zero.
  recommended_family_for_c6: EPPO_PETROLEUM
  recommended_series: "PRICE STRUCTURE OF PETROLEUM PRODUCTS - EX-REFIN."
  mapped_io_sector: "093"
  source_selected_for_c6_audit: true
  feature_semantics_approved: false
  model_feature_approved: false
  ingested_into_production: false
  selection_used_target_outcomes: false

