# Task C12 — EPPO fuel-oil modeling-channel closure.
#
# C12 closes the EPPO sector-093 fuel-oil channel for FURTHER PREDICTIVE
# MODELING after the preregistered D5 development evaluation failed to
# demonstrate incremental signal. It is a governance and evidence-preservation
# task: it reruns no model, computes no new metric, tunes no specification,
# selects no channel, evaluates no purge origin and opens no locked test.
#
# THE CLOSURE IS ABOUT MODELING USE. It does not invalidate or delete the EPPO
# archive, the semantic decisions, the transformations, the structural exposure
# or any provenance artifact, all of which remain valid within their stated
# limitations.
#
# AND IT IS NOT A SCIENTIFIC CONCLUSION. Development evidence was inconclusive.
# Inconclusive is not proof of absence, and every phrase that would turn it into
# one is prohibited by name.

schema_version: 1
task: C12
config_version: fuel_oil_channel_closure_v1
closure_version: c12_eppo_fuel_oil_channel_closure_v1
supersedes: none
superseded_by: none

