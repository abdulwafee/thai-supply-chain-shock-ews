# Task C10 — development-only fuel-oil design-matrix identifiability audit.
#
# PREREGISTERED AND FROZEN. Every tolerance, threshold, expected dimension and
# permitted statistic below was written BEFORE any C9 numeric feature value was
# read. The runner hashes this contract, re-asserts the digest before loading
# values and again after the diagnostics run; a threshold changed after seeing a
# singular value, a correlation or a condition number raises.
#
# OUTCOME-FREE STRUCTURAL AUDIT. No MPI target, no predictive association, no
# channel selection, no model, no locked test. C9 artifacts are IMMUTABLE here.

