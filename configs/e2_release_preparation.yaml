# Task E2 — reproducible portfolio release preparation.
#
# FROZEN BEFORE THE RELEASE TREE IS BUILT. The allowlist rules, the category
# taxonomy, the locked-path protection, the packaging prohibitions, the CI
# constraints and the readiness vocabulary are hashed first.
#
# E2 PREPARES A RELEASE CANDIDATE. IT PUBLISHES NOTHING. No commit, no tag, no
# push, no PyPI upload, no GitHub release. It reopens no modeling, recomputes no
# metric, and never opens, hashes, scans or copies a locked outcome.
#
# THE ALLOWLIST FAILS CLOSED. A path that matches no rule is EXCLUDED and
# reported as unclassified, never admitted by default. That is the whole point:
# the dangerous file is the one nobody thought about.

schema_version: 1
task: E2
config_version: e2_release_preparation_v1
release_contract_version: e2_release_contract_v1
release_candidate_version: "0.1.0"

# ---------------------------------------------------------------------------
# 1. The E1 closeout, preserved. Release preparation alters no scientific
#    conclusion and no evaluation artifact.
# ---------------------------------------------------------------------------
