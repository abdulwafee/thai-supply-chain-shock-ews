    - rmse
    - predictive_performance
    - high_stress_outcome_rate
    - correlation_with_a_target
    - coefficient_estimate
    - p_value
    - confidence_interval
  alternate_path_to_locked_data: false
  target_derived_field_in_configuration: false

# ---------------------------------------------------------------------------
# Authorization. Selecting an architecture grants no permission to execute it.
# ---------------------------------------------------------------------------
authorization:
  architecture_selected_from_outcomes: false
  predictive_estimand_defined: true
  primary_channel_selected: false
  target_values_read: false
  target_joined: false
  model_fitted: false
  predictive_performance_computed: false
  locked_test_accessed: false
  model_feature_approved: false
  target_join_authorized: false
  development_modeling_authorized: false
  locked_test_evaluation_authorized: false

