# Task D5 — preregistered development-only pooled fuel-oil interaction evaluation.
#
# PHASE A FREEZE. Everything below is written, hashed and read back from disk
# BEFORE the guarded target reader is enabled. A target value read before that
# checksum is verified raises and terminates the run.
#
# DEVELOPMENT ONLY, EXPLORATORY. FO 600 and FO 1500 are evaluated as co-equal
# separate variants. No channel is selected or promoted, no purge origin is
# evaluated, the locked final test stays closed, and no result here approves a
# model feature or supports a confirmatory claim.
#
# Authorized by C11-R1: d5_protocol_preregistration_authorized,
# d5_development_target_join_authorized and d5_exploratory_modeling_authorized
# are true; channel selection, confirmatory claims, purge evaluation and locked
# test evaluation are NOT.

schema_version: 1
task: D5
config_version: d5_fuel_oil_interaction_v1
protocol_version: d5_pooled_fuel_oil_interaction_protocol_v1
model_name: fixed_pooled_partial_ridge_v1
model_version: fixed_pooled_partial_ridge_v1

# ---------------------------------------------------------------------------
# 1. Upstream authorization and invariants. Reproduced before any target value
#    is read; the run STOPS rather than repairing an upstream artifact.
# ---------------------------------------------------------------------------
authorization:
  granted_by: C11-R1
  c11r1_content_checksum:
    a536dbb85444add1051e589e170bcc10756ff335ba1283723ac1644b4d36dbca
  c11r1_governance_checksum:
    81f18e8ad449283105ca6e0e8e6324280a4aaa4c6684e0f69635945c1c3a1851
  required:
    d5_protocol_preregistration_authorized: true
    d5_development_target_join_authorized: true
    d5_exploratory_modeling_authorized: true
    d5_channel_selection_authorized: false
    d5_confirmatory_claims_authorized: false
    d5_purge_evaluation_authorized: false
    d5_locked_test_evaluation_authorized: false

upstream:
  c11:
    content_checksum:
      6d525648f0e7e30860dc065c17a896426a0cf008f7ef62096974d4954c9f6d77
    decision_checksum:
      001b1d901311c1da0de1e707ca10a97f91e54584b21e52ee8c943421fc068403
    selected_architecture: pooled_common_effect_plus_centered_sector093_interaction
    architecture_status:
      exploratory_supported_after_documented_specification_correction
    source_block_rank: 5
    interaction_block_rank: 5
    combined_source_and_interaction_rank: 10
    full_design_rank: 21
    full_design_columns: 21
    eligible_industries: 11
    ind_04_eligible: false
    ind_04_direction_channel: mixed_or_ambiguous
    candidate_b_is_distinct_architecture: false
  c10:
    content_checksum:
      bb520f9e74f49afbf6f50d934dea6630c81ea366c24f78b548d03f4a95c24d1c
    diagnostic_contract_checksum:
      1c88cdd7f2017aa94ee1b069be436c469ee08adcf649fe6ad4c981f995eb2041
    unique_issue_months: 15
    eligible_feature_rows_per_variant: 165
    fully_masked_ind_04_rows_per_variant: 15
  c9:
    phase_a_checksum:
      d528aba4aedcb8b8051ad618d66d49c71239267fb26fd2ead292ee90b12c9703
    variants: [fo600_direct_sector093, fo1500_direct_sector093]
    transformations: 5
    development_issue_start: "2024-01"
    development_issue_end: "2025-03"
    development_issue_months: 15
    reference_month_rule: "reference_month = issue_month - 2"
    development_source_gaps: 0
    latest_vintage_source_values: true
    operational_policy_lag_months: 2
    operational_lag_is_measured: false
    point_in_time_source_support: false

# ---------------------------------------------------------------------------
# 2. Model equation. Frozen; the estimand is C11's and is unchanged.
# ---------------------------------------------------------------------------
model:
  residual_definition: "r[g,t,h] = y[g,t,h] - b[g,t,h]"
  equation: >-
    rhat[g,t,h] = alpha[g,h] + sum_f beta[h,f] * xtilde[t,f]
    + sum_f theta[h,f] * ez[g] * xtilde[t,f]
  final_prediction: "yhat[g,t,h] = clip(b[g,t,h] + rhat[g,t,h], 0, 100)"
  pooled_across_eligible_industries: [beta, theta]
  industry_specific: [alpha]
  horizons_fit_separately: true
  variants_fit_separately: true
  clip_lower: 0.0
  clip_upper: 100.0
  clipping_bounds_tuned: false
  estimand_changed_from_c11: false
  interpretation: non_causal_predictive_interaction

# ---------------------------------------------------------------------------
# 3. Estimator. One fixed specification, no search of any kind.
# ---------------------------------------------------------------------------
estimator:
  name: fixed_pooled_partial_ridge_v1
  loss: "(1/n) * sum_i (r_i - rhat_i)^2 + lambda * (||beta||^2 + ||theta||^2)"
  lambda: 1.0
  loss_normalised_by_n: true
  lambda_meaning_invariant_to_panel_size: true
  penalized_blocks: [source, interaction]
  penalized_coefficient_count: 10
  unpenalized_blocks: [industry_fixed_effects]
  unpenalized_coefficient_count: 11
  redundant_global_intercept: false
  alpha_grid: false
  inner_cv: false
  model_averaging: false
  fallback_estimator: false
  hyperparameter_search: false
  outcome_based_feature_removal: false
  solver: explicit_penalty_matrix_normal_equations
  normal_equation_residual_tolerance: 1.0e-8

# ---------------------------------------------------------------------------
# 4. Predictor preprocessing. Fitted on X and structural metadata only.
# ---------------------------------------------------------------------------
preprocessing:
  source_scaler:
    fitted_on: unique_permitted_training_issue_months
    fitted_on_repeated_industry_panel: false
    ddof: 0
    applied_identically_to_every_eligible_industry: true
    refit_per: [outer_issue, horizon, variant]
    zero_or_invalid_training_variance: raise
  exposure:
    centering_universe: eleven_eligible_industries
    centering_source: c9_phase_a_frozen_decision_table
    scaled_by: frozen_structural_standard_deviation
    scaling_is_a_fixed_column_reparameterization: true
    changes_the_c11_estimand: false
    fitted_on_targets: false
    recomputed_per_fold: false
    raw_and_centered_preserved_in_lineage: true
  interaction:
    constructed_after_source_standardization: true
    standardized_separately_by_industry: false
  fitted_using_targets: false

# ---------------------------------------------------------------------------
# 5. Training-row rules.
# ---------------------------------------------------------------------------
training:
  feature_reference_month_rule: "reference_month(u) = u - 2"
  feature_available_by: u
  benchmark_history_available_by: u
  label_available_by: t
  imputation_of_unavailable_source_values: false
  ind_04_in_fitted_panel: false
  all_eligible_industries_required_per_accepted_issue: true
  eligible_industries_per_issue: 11
  grouped_by_issue_month_in_all_audits: true
  all_five_transformations_required: true
  first_reference_month_with_all_five_finite: "2022-01"
  expected_counts:
    # Unique training issues and eligible rows (11 industries each).
    h1_at_2024_01: {unique_training_issues: 21, eligible_rows: 231, all_industry_rows: 252}
    h1_at_2025_03: {unique_training_issues: 35, eligible_rows: 385, all_industry_rows: 420}
    h3_at_2024_01: {unique_training_issues: 18, eligible_rows: 198, all_industry_rows: 216}
    h3_at_2025_03: {unique_training_issues: 32, eligible_rows: 352, all_industry_rows: 384}
  h3_start_constrained_by: operational_benchmark_history
  pre_2022_stress_history_synthesized: false

# ---------------------------------------------------------------------------
# 6. Evaluation contract. operational_contract_v1, asserted independently.
# ---------------------------------------------------------------------------
evaluation_contract:
  operational_contract_version: operational_contract_v1
  latest_available_stress_month: "t - 1"
  stress_month_t_used_at_issue_t: false
  fo_reference_month: "t - 2"
  horizon_1_target: "stress at t+1"
  horizon_3_target: "max stress over t+1, t+2, t+3"
  calibrator_cutoff_max: "t - 1"
  training_features_frozen_at_their_own_issue_month: true
  historical_feature_refreshed_at_outer_issue: false
  evaluation_target_read_after_prediction_freeze: true
  independent_cutoff_assertion: true

benchmarks:
  reproduced_from_registered_formulas: true
  copied_from_d3_result_artifacts: false
  d3_result_metrics_used_as_model_input: false
  d3_result_metrics_used_as_optimization_criterion: false
  primary:
    "1": operational_persistence_latest_published
    "3": operational_persistence_trailing_3m_max
  secondary_comparator: operational_no_contraction
  formulas:
    operational_persistence_latest_published: "C_t(S_{t-1})"
    operational_persistence_trailing_3m_max: "max C_t(S_{t-3}, S_{t-2}, S_{t-1})"
    operational_no_contraction: "registered no-contraction floor formula"
  every_benchmark_month_strictly_before_issue: true

# ---------------------------------------------------------------------------
# 7. Prediction counts. Reconciled exactly.
# ---------------------------------------------------------------------------
predictions:
  canonical_key: [variant_id, horizon, issue_month, industry_id]
  variants: 2
  horizons: 2
  issue_months: 15
  industries: 12
  total: 720
  pooled_model_predictions: 660
  ind_04_benchmark_passthrough: 60
  per_variant_horizon_total: 180
  per_variant_horizon_modeled: 165
  per_variant_horizon_passthrough: 15
  distinct_keys_required: 720

ind_04:
  industry_id: IND-04
  fuel_oil_predictors_created: false
  industry_fixed_effect_fitted: false
  residual_correction: 0.0
  final_prediction_equals_registered_benchmark: true
  prediction_source: benchmark_passthrough_direction_ambiguous
  in_primary_twelve_industry_denominator: true
  structural_exclusion_lineage_preserved: true
  described_as_a_fitted_zero_coefficient: false
  converted_to_structural_zero: false
  dropped_from_evaluation: false

# ---------------------------------------------------------------------------
# 8. Channel isolation.
# ---------------------------------------------------------------------------
channels:
  variants: [fo600_direct_sector093, fo1500_direct_sector093]
  run_independently: true
  prohibited:
    - shared_model_fits
    - combined_feature_tables
    - joint_penalties
    - averaging
    - pca_or_composites
    - model_stacking
    - selecting_the_better_channel
    - ranking_channels_by_mae_or_event_metrics
    - calling_either_channel_primary
  side_by_side_display_permitted: true
  cross_channel_winner_produced: false
  primary_channel_selected: false

# ---------------------------------------------------------------------------
# 9. Metrics.
# ---------------------------------------------------------------------------
metrics:
  primary: macro_industry_mae
  panel: full_twelve_industry
  report:
    - macro_industry_mae
    - pooled_mae
    - macro_industry_rmse
    - pooled_rmse
    - median_absolute_error
    - spearman_correlation
    - clipped_count
    - clipped_rate
    - paired_model_minus_primary_benchmark_mae_difference
    - mae_skill_relative_to_primary_benchmark
  eligible_only_diagnostic:
    industries: 11
    status: secondary_structurally_preregistered
    may_replace_the_full_panel_result: false
  panel_rows_treated_as_independent_observations: false

event_safety:
  high_stress_threshold: 85
  severe_stress_threshold: 95
  severe_is_descriptive_only: true
  severe_affects_any_decision: false
  thresholds_tuned: false
  report:
    - observed_event_count
    - predicted_event_count
    - precision
    - recall
    - false_negatives
    - false_positives
  rule: "event_safety_passed = model_false_negatives <= benchmark_false_negatives"
  precision_trade_off_reported_explicitly: true

# ---------------------------------------------------------------------------
# 10. Uncertainty. Paired, clustered by issue month.
# ---------------------------------------------------------------------------
bootstrap:
  cluster_unit: issue_month
  keep_all_industries_together: true
  resample_individual_industry_rows: false
  paired_resamples_identical_for_model_and_benchmark: true
  random_seed: 20260830
  replications: 1000
  confidence_level: 0.95
  block_length_by_horizon:
    "1": 1
    "3": 3
  method_by_horizon:
    "1": issue_month_cluster_bootstrap
    "3": moving_block_issue_month_bootstrap
  report:
    - model_mae_interval
    - benchmark_mae_interval
    - paired_model_minus_benchmark_mae_interval
    - issue_months_where_model_beats_benchmark
  resolution_note: >-
    Fifteen issue clusters provide limited uncertainty resolution. Intervals
    here are wide by construction and are reported as such.

# ---------------------------------------------------------------------------
# 11. Decision rules. Frozen before any target value is read.
# ---------------------------------------------------------------------------
decision_rules:
  paired_difference: "delta = MAE_model - MAE_benchmark"
  sign_convention: negative_means_the_model_is_better
  mae_evidence:
    supported: entire_paired_95_interval_below_zero
    adverse: entire_paired_95_interval_above_zero
    inconclusive: otherwise
  overall_status:
    exploratory_incremental_signal_supported:
      mae_evidence_supported_and_event_safety_passed
    incremental_signal_not_supported: mae_evidence_adverse
    inconclusive: otherwise
  applied_separately_to_every_variant_and_horizon: true
  regardless_of_result:
    channel_selected: false
    model_feature_approved: false
    locked_evaluation_authorized: false
    confirmatory_claim_made: false

# ---------------------------------------------------------------------------
# 12. Temporal and leakage guards. Each raises.
# ---------------------------------------------------------------------------
guards:
  - stress_month_t_used_at_issue_t
  - feature_later_than_t_minus_2
  - historical_training_feature_refreshed_at_outer_issue
  - label_used_before_its_d3_availability_month
  - calibrator_includes_stress_after_t_minus_1
  - evaluation_target_read_before_prediction_freeze
  - purge_or_locked_origin_in_any_metric
  - scaling_uses_development_evaluation_rows_outside_the_training_set
  - industry_rows_shuffled_across_time_for_validation_or_bootstrap
  - target_outcomes_alter_preprocessing_or_estimator_configuration

purge_and_locked:
  purge_issue_months: ["2025-04", "2025-06"]
  locked_issue_months: ["2025-07", "2026-04"]
  purge_evaluated: false
  locked_test_accessed: false
  purge_or_locked_rows_materialised: false

# ---------------------------------------------------------------------------
# 13. Final scope fields, stated on every result.
# ---------------------------------------------------------------------------
scope:
  evaluation_scope: development_only
  confirmatory_evaluation: false
  latest_vintage_evaluation: true
  fully_real_time_backtest: false
  channel_selected: false
  target_joined_for_authorized_development_evaluation: true
  model_trained_for_authorized_development_evaluation: true
  purge_evaluated: false
  locked_test_accessed: false
  locked_test_evaluation_authorized: false
  model_feature_approved: false

lineage:
  required_references:
    - d5_protocol_checksum
    - c11r1_authorization_checksum
    - c11_architecture_checksum
    - c10_design_matrix_checksum
    - c9_conditioned_feature_row
    - c8_transformation_lineage
    - sector_093_exposure_and_centering_scaling_rule
    - training_issue_keys
    - scaler_statistics
    - penalty_specification
    - fitted_coefficient_checksum
    - benchmark_lineage
    - calibrator_cutoff
    - label_availability_cutoff
    - prediction_clipping_state
    - ind_04_passthrough_reason
  re_derived_independently: true
  prediction_checksums: 720

outputs:
  protocol_markdown: docs/d5_modeling_protocol.md
  assembly_audit_markdown: docs/d5_assembly_audit.md
  assembly_audit_json: docs/d5_assembly_audit.json
  results_markdown: docs/d5_development_results.md
  results_json: docs/d5_development_results.json
  frozen_protocol_json: docs/d5_frozen_protocol.json
  predictions: data/model_input/d5_fuel_oil_predictions.parquet
  coefficients: data/model_input/d5_fuel_oil_coefficients.parquet
  generated_tables_git_ignored: true
