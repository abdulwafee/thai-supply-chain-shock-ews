# Obsidian vault export — the frozen contract.
#
# THE VAULT IS A VIEW, NOT A SOURCE. Every note is generated from a file in this
# repository and carries a checksum of its own body. A note that has been edited
# by hand is NOT overwritten: the generator reports it and leaves it alone,
# because silently regenerating over an edit is how a second source of truth
# gets created, and this vault already drifted once that way.
#
# NOTHING IS WRITTEN INSIDE THE REPOSITORY. The generated notes live in the
# Obsidian vault that contains this repository, so `git status` stays clean and
# the release manifest is unaffected. Only the generator, this contract and its
# tests are version-controlled.
#
# THE LOCKED FINAL TEST IS NOT A DATA SOURCE. No note may name a locked-outcome
# path, and no note may carry an observation, prediction or metric read from
# one. The concept note about the locked test is written from the reservation
# keys only.

schema_version: 1
task: OBSIDIAN-VAULT
config_version: obsidian_vault_v1

# ---------------------------------------------------------------------------
# 1. Where things go. Paths are relative to the repository root.
# ---------------------------------------------------------------------------
target:
  vault_root: ".."
  notes_folder: "Knowledge Graph"
  archive_folder: "_archive"
  writes_inside_repository: false
  obsidian_config: ".obsidian/app.json"

# Obsidian walks every file in the vault. Without these it indexes the virtual
# environment and a hundred megabytes of downloaded workbooks, and the graph
# view fills with orphan nodes from third-party package READMEs.
#
# THE PATHS BELOW ARE RELATIVE TO THE REPOSITORY ROOT, and carry no checkout
# folder name. Obsidian needs a vault-relative filter, and the vault is the
# parent of the checkout, so the folder name is genuinely part of what Obsidian
# is told -- but it is *not* part of what is version-controlled here. The
# builder reads the real directory name at runtime and prefixes each entry.
# Writing the name into this file would make the filters work only in a
# checkout that happened to be called that, which is the same defect the
# `superseded_by` paths above had.
#
# `kind` is preserved deliberately. Obsidian treats a bare string as a name
# filter and a `path:`-prefixed string as a path filter, and they are not
# interchangeable. It is declared per entry rather than inferred from a prefix
# somebody might forget to type.
ignore_filters_relative_to: repository_root
ignore_filters_render_separator: "/"
ignore_filters:
  - {kind: name, path: ".venv"}
  - {kind: name, path: "data/raw"}
  - {kind: name, path: "data/interim"}
  - {kind: name, path: "data/features"}
  - {kind: name, path: "data/processed"}
  - {kind: name, path: "data/targets"}
  - {kind: name, path: "data/model_input"}
  - {kind: name, path: ".git"}
  - {kind: name, path: ".pytest_cache"}
  - {kind: name, path: ".ruff_cache"}
  - {kind: path, path: "dist"}
  - {kind: path, path: "build"}

# ---------------------------------------------------------------------------
# 2. The frontmatter contract every generated note carries.
# ---------------------------------------------------------------------------
frontmatter:
  required_keys:
    - type
    - generated
    - generated_by
    - generated_from
    - content_sha256
  generated_flag: true
  generated_by: scripts/build_obsidian_vault.py
  hand_edit_policy: report_and_skip
  hand_edit_policy_reason: >-
    A regenerated note that silently overwrites an edit turns the vault into a
    second, quietly diverging record. The generator compares each existing
    note's body against the checksum that note declares about itself, and skips
    any note whose body has moved.

# ---------------------------------------------------------------------------
# 3. What may never appear in a note.
# ---------------------------------------------------------------------------
prohibitions:
  locked_outcome_path_fragments:
    - "locked_test/"
    - "locked_outcome"
    - "locked_target"
    - "locked_prediction"
    - "locked_score"
    - "final_test_outcome"
  no_absolute_paths: true
  absolute_path_patterns:
    - "[A-Za-z]:\\\\Users\\\\"
    - "/home/"
    - "/Users/"
  no_raw_third_party_values: true
  no_invented_numbers: true
  no_invented_numbers_rule: >-
    Every figure in a generated note is read from a repository file during this
    run. Nothing is carried over from a previous run, quoted from memory, or
    rounded into a nicer number.

# ---------------------------------------------------------------------------
# 4. Note types, and the real file each is generated from.
# ---------------------------------------------------------------------------
note_types:
  index:
    tag: ews
    source: whole repository
  concept:
    tag: ews/concept
    source: this contract's `concepts` block
  source:
    tag: ews/source
    source: DATA_SOURCES.md and data/raw/_manifests/*.jsonl
  task:
    tag: ews/task
    source: scripts/run_*.py, docs/architecture/decision_log.md, docs/, configs/
  package:
    tag: ews/package
    source: src/thai_supply_chain_ews/*/
  report:
    tag: ews/report
    source: measured during this run

# Edges become [[wikilinks]]. Only these are emitted: a link that does not
# stand for a real dependency is decoration, and decoration in a graph view is
# indistinguishable from a finding.
edge_types:
  feeds: one entity's output is another's input
  governs: a decision or closure constrains another task
  supersedes: a later task replaced an earlier one's conclusion
  documents: a file records what a task concluded
  configures: a frozen contract governs a run

# ---------------------------------------------------------------------------
# 5. Concept notes. The prose lives here so the note stays a pure render.
# ---------------------------------------------------------------------------
concepts:
  - title: Locked Final Test
    summary: Reserved months that were never opened, and the reason that is the result.
    body: >-
      Ten issue months are reserved at horizon 1 and eight at horizon 3, with a
      purge buffer between the development window and the reservation. The
      reservation manifests are key-only: they carry month keys and row counts
      and no observation, which is exactly what lets the closeout confirm the
      ranges without reading anything.


      It was never opened, hashed, scanned, packaged or copied, and its file
      sizes were never read either, because a size is already an inference about
      contents. No candidate earned access through development evidence, so it
      stays closed. That is the outcome, not a step still pending.
    links: [Preregistration, Supersession]

  - title: Issue-Month Contract
    summary: A forecast may only use what was published by the date it was issued.
    body: >-
      Every evaluation origin is an issue month, and a prediction made at that
      origin may read only what a publisher had actually released by then.
      Features are archived first-release with verified dates; requesting the
      current month's stress at issue month t raises rather than returning a
      value.


      The contract is why the earlier D1 figures are not comparable to the later
      ones: D1 predates it. Two evaluations under different contracts may not be
      compared without saying so, and a guard raises when they appear together
      unqualified.
    links: [Five Distinct States, Preregistration]

  - title: Five Distinct States
    summary: Observed zero, unresolved, ineligible, missing and not run are five facts, not one.
    body: >-
      An observed zero means the quantity was measured and was zero. Unresolved
      means nobody established the answer. Ineligible means a rule excluded it,
      not a value. Missing means it should exist and does not. Not run means it
      was never attempted.


      Collapsing any two of them turns an absent measurement into a finding.
      Ineligible predictors are omitted rather than zero-filled, because a zero
      would claim an observation nobody made; an unavailable scanner reports
      `not_run` rather than `clean`, because a scan nobody performed found
      nothing in the same uninformative sense that an unopened box contains
      nothing.
    links: [Preregistration]

  - title: Preregistration
    summary: Thresholds are written to disk and checksummed before any outcome is read.
    body: >-
      Structural decisions and evaluation protocols are frozen to disk, hashed,
      and read back before any value or target is loaded. A run that reaches a
      target before the freeze raises and terminates rather than continuing.


      When an observation contradicts a preregistered expectation, the expected
      value stays as written and the discrepancy is recorded beside it with a
      flag saying the correction came after observation. Editing the expectation
      to match the data is the failure the freeze exists to prevent.
    links: [Supersession, Five Distinct States]

  - title: Supersession
    summary: A replaced conclusion is marked, never deleted.
    body: >-
      When a later task replaces an earlier one's conclusion, the earlier record
      stays exactly as written and gains a marker naming its successor. D1's
      figures are wrong for operational purposes and are still in the ledger.
      Task E2 concluded the release was blocked; E2-R1 applied the owner's
      decisions and pinned E2's findings by checksum rather than editing them.


      The supersession graph is checked acyclic, and the superseded runner
      refuses to execute, because a promise that depends on nobody happening to
      re-run an old script is not a guarantee. Deleting a negative result is how
      a record starts lying.
    links: [Preregistration, Locked Final Test]

# ---------------------------------------------------------------------------
# 6. The drift this export inherited, and what supersedes each file.
# ---------------------------------------------------------------------------
# These sat at the vault root as an early snapshot while the repository moved
# on. Every line unique to them is either a path that has since changed or a
# statement the project has superseded, so nothing unique and still true is
# archived away. They are moved rather than deleted or stubbed: a superseded
# record stays a record.
archive:
  reason: superseded_by_repository_copy
  move_not_delete: true
  # `superseded_by` is relative to the REPOSITORY ROOT, never to the checkout
  # folder. A checkout is named by whoever cloned it, and the name differs
  # between this project's own directory, GitHub's default for the repository
  # and any local clone, so a path carrying a folder name resolves only on the
  # machine that wrote it. No checkout folder name appears in this file.
  superseded_by_paths_are_relative_to: repository_root
  files:
    - name: decision_log.md
      superseded_by: docs/architecture/decision_log.md
      note: The vault copy holds AD-R1 to AD-R4; the repository copy is a superset.
    - name: data_architecture.md
      superseded_by: docs/architecture/data_architecture.md
      note: Differs only in paths that have since moved.
    - name: data_contract_industry_month_panel.md
      superseded_by: docs/architecture/data_contract_industry_month_panel.md
      note: Differs only in a path that has since moved.
    - name: data_source_inventory.md
      superseded_by: docs/data_source_inventory.md
      note: >-
        The vault copy states that no pipeline was built and no data downloaded.
        That was true when it was written and is not true now.
    - name: project_roadmap.md
      superseded_by: docs/project_roadmap.md
      note: Differs only in a path that has since moved.
    - name: target_definition.md
      superseded_by: docs/target_definition.md
      note: >-
        The vault copy records all four target components as unresolved. B2 and
        B3 have since resolved the target to MPI alone.
    - name: modeling_strategy.md
      superseded_by: docs/modeling_strategy.md
      note: Identical to the repository copy; archived to remove the duplicate.

# ---------------------------------------------------------------------------
# 7. What this export deliberately does not produce.
# ---------------------------------------------------------------------------
not_produced:
  dataview_queries:
    reason: >-
      No community plugin is installed in this vault, so Dataview is not
      available. Emitting queries that render as raw code blocks would look
      broken rather than useful.
  base_files:
    reason: >-
      The Bases core plugin is enabled, but its file syntax could not be
      verified in this environment and a malformed one shows an error in place
      of a view. Navigation is provided as Markdown tables in the index instead,
      which render everywhere.
  one_note_per_decision:
    reason: >-
      170 decisions as 170 files would bury the graph in leaf nodes. Each
      decision is a block inside its task's note, addressable by block id, so
      backlinks still work and the graph still reads.
