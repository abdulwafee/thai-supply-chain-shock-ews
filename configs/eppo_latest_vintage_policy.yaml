# ---------------------------------------------------------------------------
# Evidence-boundary wording. Each field replaces a claim that would exceed what
# C6 actually established.
# ---------------------------------------------------------------------------
evidence_boundaries:
  legacy_archive_status: tested_legacy_urls_no_longer_expose_original_archive
  historical_timing_status: not_reconstructable_from_sources_inspected_in_c6
  monthly_presence_coverage: complete
  complete_daily_document_validation: false
  point_in_time_values_supported: false
  absence_from_inspected_mechanisms_is_not_proof_of_universal_absence: true
  statement: >-
    Absence from the inspected mechanisms is not proof that no historical
    publication evidence exists anywhere. C6 probed the current WordPress
    archive, its REST index, sitemaps, RSS and the legacy Joomla paths; other
    mechanisms, offline records or a direct request to EPPO were not exercised.
  superseded_wording:
    - "the legacy archive no longer exists"
    - "historical timing can never be verified"
    - "all daily values in the required window were validated"
    - "65/65 month coverage means a complete daily archive"
    - "archive depth alone makes every transformation feature-ready"

# ---------------------------------------------------------------------------
# Ingestion levels. These are five different things and were being conflated.
# ---------------------------------------------------------------------------
ingestion_levels:
  monthly_document_presence_verified: true
  complete_daily_inventory_discovered: true
  complete_daily_documents_downloaded: false
  complete_daily_documents_validated: false
  monthly_aggregation_contract_approved: false
  audited_sample_documents: 254
  discovered_document_days_parity_window: 1315
  discovered_document_days_operational_window: 1076
  note: >-
    The 254 validated documents are an AUDIT SAMPLE spanning all required
    months. They are not a complete daily ingestion of the 1,315 discovered
    document-days, and the 722-row partial audit table is not a production
    price series.

# ---------------------------------------------------------------------------
# Capture-evidence interpretation.
# ---------------------------------------------------------------------------
capture_audit:
  captures_total: 43
  provider: internet_archive_cdx
  # Preregistered CLASSIFICATION CONVENTION, not an empirical finding.
  contemporaneous_window_days: 31
  archived_bytes_fetched: false
  source_identity_validated: false
  evidence_classes:
    - contemporaneous_capture_upper_bound
    - retrospective_capture_not_timing_evidence
    - capture_identity_unverified
    - capture_after_effective_date_only
    - unresolved
  capture_date_is_first_publication_date: false
  delay_statistics_from_upper_bounds_only: true
  derive_minimum_lag_from_sparse_upper_bounds: false

# ---------------------------------------------------------------------------
# THE DECISION.
# ---------------------------------------------------------------------------
decision: proceed_exploratory_release_lag_aware_latest_vintage

policy:
  latest_vintage_values_used: true
  historical_release_timing_verified: false
  point_in_time_values_supported: false
  fully_real_time_backtest: false

  # Measured: does not exist. Policy: chosen conservatively by the project.
  minimum_verified_publication_lag_months: null
  operational_policy_lag_months: 2
  operational_lag_is_measured: false
  operational_lag_basis: conservative_project_policy

  same_month_use_permitted: false
  publication_lag_1m_use_permitted: false
  operational_lag_2m_use_permitted: true

  eligible_for_exploratory_development: true
  eligible_for_confirmatory_claims: false
  eligible_for_locked_test: false

  feature_semantics_approved: false
  model_feature_approved: false

interpretation:
  rule: "reference_month <= issue_month - 2"
  meaning: >-
    At forecast issue month t, an EPPO monthly source observation may refer at
    latest to reference month t-2. This is a conservative policy assumption. It
    is NOT a measured publication delay.

# Availability fields stay separate so a policy date can never masquerade as
# provenance.
observation_availability_fields:
  source_available_as_of: null
  policy_available_month: reference_month + 2 months
  availability_basis: conservative_policy_not_historical_measurement
  historical_timing_verified: false
  policy_date_may_populate_source_available_as_of: false

# ---------------------------------------------------------------------------
# Why this is allowed, and what argues against it. Both are recorded.
# ---------------------------------------------------------------------------
rationale_for:
  - the overall evaluation is already latest-vintage on the MPI target side
  - D3 is explicitly a release-lag-aware latest-vintage evaluation, not a real-time backtest
  - EPPO has strong structural alignment with I/O sector 093 (C5)
  - required-month document presence is complete (65/65 and 53/53)
  - the exact ex-refinery fields can be parsed, stage-separated from wholesale and retail
  - no same-date revision was observed in the audited sample
  - the policy imposes a conservative two-month delay
  - all future results must remain exploratory

rationale_against:
  - complete daily archive validation is unfinished (254 of 1,315 document-days)
  - release timing is unverified; every upload timestamp is a 2026 migration stamp
  - absence of observed revisions does not prove no historical revision occurred
  - migration may have changed filenames, metadata or bytes
  - a two-month lag does not make latest-vintage values point-in-time
  - the target side remains latest-vintage as well
  - the source cannot support a fully real-time claim

