# Task C6.5 — EPPO latest-vintage use decision and operational availability
# contract.
#
# C6 found the values retrievable and the release timing unverifiable from the
# sources it inspected. This file records the resulting POLICY decision, and
# keeps the policy assumption strictly apart from anything measured.
#
# NO FEATURE, NO AGGREGATION, NO TARGET, NO MODEL, NO LOCKED TEST.

