# ---------------------------------------------------------------------------
variants:
  fo600_direct_sector093:
    channel_id: eppo_fo600_channel
    series_id: eppo_ex_refinery_fo600_2s
  fo1500_direct_sector093:
    channel_id: eppo_fo1500_channel
    series_id: eppo_ex_refinery_fo1500_2s
shared_structural_exposure_group: io_sector_093
variant_restrictions:
  additive_aggregation_allowed: false
  simple_average_allowed: false
  automatic_composite_index_allowed: false
  simultaneous_model_entry_approved: false
  outcome_based_variant_selection_allowed: false
  prohibited_constructions:
    - added_conditioned_features
    - averaged_conditioned_features
    - combined_fuel_oil_index
    - pca
    - two_independent_exposure_measurements_claim
    - primary_variant_chosen_from_target_performance

