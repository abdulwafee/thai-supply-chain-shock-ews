# ---------------------------------------------------------------------------
# 5. Frozen historical runners. Preserved unchanged; they produced the legacy
#    pins and are the reason this file exists. None can create a new pin without
#    first overwriting a historical document, which the preservation tests refuse.
# ---------------------------------------------------------------------------
frozen_historical_hashing:
  - {path: scripts/run_e2_release_preparation.py, symbol: _file_checksum,
     reason: "Superseded by E2-R1 and refuses to execute at all."}
  - {path: scripts/run_c11r1_governance_closure.py, symbol: byte_sha256,
     reason: "Produced the two C11 legacy pins."}
  - {path: scripts/run_c12_channel_closure.py, symbol: byte_sha256,
     reason: "C12 closure record."}
  - {path: scripts/validate_oie_overlap.py, symbol: sha256_of,
     reason: "Produced the v1 OIE pin; superseded by the v2 script."}
  - {path: src/thai_supply_chain_ews/synthesis/reproducibility_manifest.py, symbol: inline,
     reason: "E1 evidence ledger."}
  - {path: scripts/run_b3_target_build.py, symbol: _sha256, reason: "B3 record."}
  - {path: scripts/run_b4_baselines.py, symbol: _sha256, reason: "B4 record."}
  - {path: scripts/audit_history_extension.py, symbol: _sha256, reason: "A1 audit."}
  - {path: scripts/audit_target_sources.py, symbol: _sha256, reason: "A1 audit."}
  - {path: scripts/audit_c5_price_stage_alignment.py, symbol: inline, reason: "C5 audit."}

# ---------------------------------------------------------------------------
# 6. Assertion sites that were vulnerable and are now representation-aware.
#
#    Found by auditing the hashing call sites, not by reading a CI log: both
#    compare a working tree against digests taken on Windows, and both would
#    have failed on a Linux machine that has the data. Neither failed in CI,
#    and that was luck rather than correctness -- each is registered
#    data-backed, and CI has no generated tables, so each was skipped. A skipped
#    test is not a passing test, so they were corrected rather than tolerated.
# ---------------------------------------------------------------------------
corrected_worktree_pin_assertions:
  - path: tests/test_c12_channel_closure.py
    test: test_the_pinned_artifacts_are_all_present_and_unchanged
    data_backed_registered: true
    representation_aware: true
    pins_declared_in: docs/c12_channel_closure.json
    pinned_field: preservation.byte_checksums
    affected_documents:
      - docs/d5_frozen_protocol.json
    binary_rows_hashed_raw: true
    correction: >-
      Comparison logic only. The pinned literals in
      docs/c12_channel_closure.json are untouched; a raw-byte match is still
      tried first, and only a path declared above may fall back to its single
      declared representation.
  - path: tests/test_e1_evidence_synthesis.py
    test: test_synthetic_18_an_upstream_result_artifact_is_modified
    data_backed_registered: true
    representation_aware: true
    pins_declared_in: docs/e1_reproducibility_manifest.json
    pinned_field: artifacts[].checksum where checksum_kind == byte_sha256
    affected_documents:
      - docs/d3_locked_test_manifest.json
      - docs/d3r1_benchmark_interpretation.json
      - docs/d5_frozen_protocol.json
    binary_rows_hashed_raw: true
    correction: >-
      Comparison logic only. The pinned literals in
      docs/e1_reproducibility_manifest.json are untouched, and the eight Parquet
      rows in the same loop keep raw-byte hashing, which is correct for them.
    scope_note: >-
      docs/d3_locked_test_manifest.json is verified as a tracked public document
      and nothing more. No path inside it is followed, and no locked outcome,
      locked dataset or final-test artifact is opened, listed, hashed or
      evaluated.

# ---------------------------------------------------------------------------
# 7. A pin assertion that is safe today, and why that is a measurement rather
#    than an assumption. Every document it pins is CR-free, so the recorded
#    digest is already canonical and matches on both platforms. Listed so the
#    guard has an account of the site, and so the claim is re-checked on every
#    run instead of being remembered.
# ---------------------------------------------------------------------------
worktree_pin_assertions_lf_clean:
  - path: tests/test_d3_operational_baselines.py
    test: test_restored_d1_document_checksums_are_recorded
    pins_declared_in: docs/d3_restored_d1_checksums.json
    pinned_key: restored
    reason: >-
      Both restored D1 documents carry no carriage return, so their raw and
      canonical digests are the same value. The test therefore passes on Linux
      and on Windows for the same reason, not by luck. A test verifies that this
      is still true rather than trusting this sentence.
