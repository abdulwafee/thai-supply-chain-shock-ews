# ---------------------------------------------------------------------------
# 4. Where raw-byte hashing is correct and must not be canonicalised.
#    A blanket ban would corrupt every one of these.
# ---------------------------------------------------------------------------
raw_byte_hashing_allowed:
  - {path: src/thai_supply_chain_ews/data/oie.py, symbol: sha256_of_file,
     hashes: downloaded_xlsx_workbook,
     reason: "A publisher's binary workbook. Normalising bytes would corrupt it."}
  - {path: src/thai_supply_chain_ews/data/source_manifests.py, symbol: sha256_of_file,
     hashes: downloaded_source_document,
     reason: "Retrieval manifests record the bytes the publisher served."}
  - {path: src/thai_supply_chain_ews/data/eppo_full_archive.py, symbol: sha256_bytes,
     hashes: downloaded_xls_workbook,
     reason: "Legacy BIFF workbooks; binary."}
  - {path: src/thai_supply_chain_ews/data/eppo_product_semantics.py, symbol: inline,
     hashes: downloaded_attachment, reason: "Binary attachment bytes."}
  - {path: scripts/run_c2_commodity_features.py, symbol: inline,
     hashes: generated_parquet, reason: "Binary columnar file."}
  - {path: scripts/run_c3_industry_exposure.py, symbol: inline,
     hashes: generated_parquet, reason: "Binary columnar file."}
  - {path: scripts/run_c4_industry_conditioned_features.py, symbol: inline,
