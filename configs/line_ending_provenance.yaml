# Line-ending provenance for the historical checksums (Task CI-R1).
#
# NOT ONE PIN BELOW IS EDITED. Each value is copied verbatim from the document
# that recorded it, and verification re-derives it from content rather than
# trusting the copy. If the copy and the source document ever disagree, that is
# an error, not a correction.
#
# WHY THIS FILE EXISTS. Several early runners wrote a document with
# Path.write_text on Windows -- where \n becomes \r\n on disk -- then hashed the
# file they had just written. Git normalised the same file to LF on commit, so on
# a Linux checkout the bytes no longer match a pin that was meant to prove the
# record had not been edited. Nothing was ever edited. The digest measured the
# working tree instead of the text, and it took a Linux CI run to notice.
#
# ALL HISTORICAL READS COME FROM GIT OBJECTS, NOT THE WORKING TREE. The branch
# that adds this file also appends to docs/architecture/decision_log.md, which is
# itself one of the affected paths. Verifying against the working tree would make
# this file's own commit change what the v1.0.0 record says.

schema_version: 1
task: CI-R1
config_version: line_ending_provenance_v1

# ---------------------------------------------------------------------------
# 1. The rule for everything from here on.
# ---------------------------------------------------------------------------
canonical_representation: canonical_lf
canonical_rule: >-
  Every new pin on a text artifact is a SHA-256 of the file's bytes with CRLF
  normalised to LF. That is what git stores and what every platform checks out,
  so it is the one representation that means the same thing everywhere. New text
  artifacts are written with newline="\n" so the working tree agrees with the
  blob and raw-byte tools agree too.
new_pins_may_declare_a_legacy_representation: false
tolerated_vulnerable_pin_assertions: 0

subject_commit: 8c3c8f9cc9dfb6fd4e53729615191f2726c25047
subject_commit_reachable_as_tag: v1.0.0
network_access_during_verification: false
reads_working_tree_for_historical_paths: false

# ---------------------------------------------------------------------------
# 2. Representations.
# ---------------------------------------------------------------------------
representations:
  canonical_lf:
    render: the content itself
  windows_crlf_worktree:
    render: canonical content with every LF replaced by CRLF
    why_it_exists: >-
      Written by a Python runner on Windows, hashed from the working tree before
      git normalised it. The text is identical to the committed blob; only the
      line terminator differs.
  unreproducible_mixed_worktree:
    render: none -- deliberately not renderable
    why_it_exists: >-
      The working tree mixed CRLF with bare LF at generation time. That byte
      pattern cannot be reconstructed from content, so the pin is preserved and
      verified as preserved rather than re-derived. Inventing a renderer for it
      would repeat the original mistake in a new place.

# ---------------------------------------------------------------------------
# 3. The ten historical artifact pins.
# ---------------------------------------------------------------------------
