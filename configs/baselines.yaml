# Deterministic baselines — Task B4
#
# These are NOT models. They are the floor a future ML model has to clear to
# justify its complexity. None of them is tuned, fitted by search, or
# weight-averaged with another; every one is a fixed rule evaluated under the
# same walk-forward information constraints as a real model would be.

schema_version: 1
baselines_version: baselines_v1

baselines:
  - name: persistence_current_month
    horizons: [1, 3]
    simplicity_rank: 1 # lower = simpler; used only to break an exact tie
    description: >-
      Predict that the future stress score equals the calibrated stress score of
      the forecast-origin month itself.
    rule: "predicted_score = calibrator.transform(industry, raw_stress[t])"
    predicted_raw_available: true

  - name: persistence_trailing_3m_max
    horizons: [3]
    simplicity_rank: 2
    description: >-
      Three-month variant: predict using the maximum calibrated monthly stress
      over t-2, t-1 and t. Named distinctly from persistence_current_month
      because it is a different rule, not a parameterization of it.
    rule: "predicted_score = max(calibrator.transform(industry, raw_stress[t-2..t]))"
    predicted_raw_available: true

  - name: industry_historical_mean
    horizons: [1, 3]
    simplicity_rank: 3
    is_skill_reference: true
    description: >-
      Predict the mean calibrated target score across that industry's own
      historically completed training labels for the same horizon.
    rule: "predicted_score = mean(calibrated training target scores for this industry+horizon)"
    predicted_raw_available: false
    pool_industries: false # never silently pooled
    on_insufficient_history: raise

  - name: seasonal_naive
    horizons: [1, 3]
    simplicity_rank: 4
    description: >-
      Use last year's raw stress for the corresponding target window, then
      transform it with the calibrator frozen at the current origin.
    rule_h1: "predicted_raw = raw_stress[target_month - 12 months]"
    rule_h3: "predicted_raw = max(raw_stress over (t+1..t+3) shifted back 12 months)"
    predicted_raw_available: true
    source_months_must_be_on_or_before_origin: true

  - name: no_contraction
    horizons: [1, 3]
    simplicity_rank: 0
    description: >-
      Predict zero year-over-year MPI contraction, then transform 0.0 with the
      frozen industry calibrator. This is the "nothing bad happens" reference.
    rule: "predicted_raw = 0.0; predicted_score = calibrator.transform(industry, 0.0)"
    predicted_raw_available: true

policy:
  tuning_permitted: false
  weight_averaging_permitted: false
  ensembling_permitted: false
  note: >-
    Baselines exist to be beaten, not optimized. Tuning them would blur the line
    between a benchmark and a model and would quietly consume development data.
